name: Android CI

# Builds the FOSS APKs and uploads them as workflow artifacts.
# Nothing is published: no Play Store bundle, no GitHub release, no Discord post.

on:
  # Branch pushes are covered by the pull_request run; building them on push
  # too would build every PR commit twice. main is built on push so its APKs
  # can be reused by the Android Release workflow.
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - '.github/workflows/ci-android.yml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/ci-android.yml'
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to build
        required: true
        default: main
  workflow_call:
    inputs:
      ref:
        description: Branch, tag or commit to build
        type: string
        required: false
        default: ''

# A newer push to the same PR/branch cancels the run it supersedes.
concurrency:
  group: ${{ github.workflow }}-${{ inputs.ref || github.event.pull_request.number || github.ref }}
  # Only PR runs are cancelled; every main commit keeps its build and analysis.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RELEASE_KEYSTORE_FILE: ${{ secrets.RELEASE_KEYSTORE_FILE }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: true
          ref: ${{ inputs.ref || inputs.branch || github.ref }}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          # Lets setup-gradle also cache the configuration cache (enabled in
          # gradle.properties). Optional: without the secret it is just skipped.
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      - name: Setup Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          # The legacy 'tools' package installed by default no longer exists.
          packages: platform-tools
      - name: Accept Licenses
        run: yes | sdkmanager --licenses
      - name: Install NDK
        run: sdkmanager "ndk;30.0.14904198"

      # Optional signing of the release APK: only when the keystore secrets are
      # configured, otherwise it is left unsigned. The debug APK is always
      # signed with the debug key.
      - name: Configure release signing
        if: github.event_name != 'pull_request' && env.RELEASE_KEYSTORE_FILE != ''
        run: |
          echo "$RELEASE_KEYSTORE_FILE" | base64 --decode > android/release.keystore
          cat <<EOF > android/local.properties
          RELEASE_STORE_FILE=../release.keystore
          RELEASE_STORE_PASSWORD=${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS=${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD=${{ secrets.RELEASE_KEY_PASSWORD }}
          EOF

      - name: Build APKs and root module zips
        run: ./gradlew assembleFossDebug assembleFossRelease zipDebugModule zipReleaseModule
        working-directory: android

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: apk-debug
          path: android/app/build/outputs/apk/foss/debug/*.apk

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: apk-release
          path: android/app/build/outputs/apk/foss/release/*.apk

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: root-module-zips
          path: android/app/build/outputs/rootModuleZips/*.zip

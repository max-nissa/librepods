name: Android CI

# Builds the FOSS APKs and uploads them as workflow artifacts.
# Nothing is published: no Play Store bundle, no GitHub release, no Discord post.

on:
  push:
    branches:
      - '*'
    paths:
      - 'android/**'
      - '.github/workflows/ci-android.yml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/ci-android.yml'
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to build
        required: true
        default: main
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RELEASE_KEYSTORE_FILE: ${{ secrets.RELEASE_KEYSTORE_FILE }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.branch || github.ref }}
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Accept Licenses
        run: yes | sdkmanager --licenses
      - name: Install NDK
        run: sdkmanager "ndk;30.0.14904198"

      # Optional signing: only when the keystore secrets are configured.
      # Without them the debug APK is signed with the debug key and the
      # release APK is left unsigned.
      - name: Configure release signing
        if: github.event_name != 'pull_request' && env.RELEASE_KEYSTORE_FILE != ''
        run: |
          echo "$RELEASE_KEYSTORE_FILE" | base64 --decode > android/release.keystore
          cat <<EOF > android/local.properties
          RELEASE_STORE_FILE=../release.keystore
          RELEASE_STORE_PASSWORD=${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS=${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD=${{ secrets.RELEASE_KEY_PASSWORD }}
          EOF

      - name: Build APKs
        run: ./gradlew assembleFossDebug assembleFossRelease
        working-directory: android

      - uses: actions/upload-artifact@v4
        with:
          name: apk-debug
          path: android/app/build/outputs/apk/foss/debug/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: apk-release
          path: android/app/build/outputs/apk/foss/release/*.apk

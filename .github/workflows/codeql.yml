name: CodeQL

# Advanced CodeQL setup. The default setup uses "autobuild" for Java/Kotlin,
# which cannot build the Android app (it needs the Android SDK and NDK), so
# java-kotlin is built manually with the same steps as ci-android.yml.
# The other languages are analysed without a build (build-mode: none).
# No javascript-typescript: the only .ts files are Qt translations (XML).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '27 3 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Only PR runs are cancelled; every main commit keeps its build and analysis.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: c-cpp
            build-mode: none
          - language: java-kotlin
            build-mode: manual
          - language: python
            build-mode: none

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      # Manual build for java-kotlin, mirroring ci-android.yml.
      - if: matrix.build-mode == 'manual'
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21
      - if: matrix.build-mode == 'manual'
        uses: gradle/actions/setup-gradle@v4
      - name: Setup Android SDK
        if: matrix.build-mode == 'manual'
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Accept licenses and install NDK
        if: matrix.build-mode == 'manual'
        run: |
          yes | sdkmanager --licenses
          sdkmanager "ndk;30.0.14904198"
      - name: Compile Android app
        if: matrix.build-mode == 'manual'
        working-directory: android
        # CodeQL extracts Java/Kotlin by tracing the compilers, so the sources
        # must really be compiled here: a prebuilt APK or cached task outputs
        # cannot be reused (hence --no-build-cache --rerun-tasks).
        # Only compile the sources: packaging, dexing and the native CMake build
        # add nothing to the java-kotlin database (C/C++ is scanned separately).
        run: ./gradlew :app:compileFossDebugSources --no-daemon --no-build-cache --rerun-tasks

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}

name: Android Release

# Manually cut a GitHub release: creates the tag (if it does not exist yet)
# and publishes a release with the FOSS APKs and root module zips attached.
#
# Nothing is rebuilt when Android CI already built `ref` on a push to main:
# the release reuses that run's artifacts. Otherwise (older commit whose
# artifacts expired, another branch, or `rebuild` checked) it runs Android CI
# for `ref` first and uses the fresh artifacts.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to create, e.g. v1.0.0-rc3-free
        required: true
      ref:
        description: Branch or commit to release
        required: true
        default: main
      notes:
        description: Release notes (Markdown). Empty = auto-generated from merged PRs.
        required: false
        default: ''
      prerelease:
        description: Mark as pre-release
        type: boolean
        default: true
      rebuild:
        description: Rebuild instead of reusing the Android CI artifacts
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

jobs:
  find-build:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.find.outputs.sha }}
      run-id: ${{ steps.find.outputs.run-id }}
    steps:
      - name: Look for an Android CI build of this commit
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ github.event.inputs.ref }}
          REBUILD: ${{ github.event.inputs.rebuild }}
        run: |
          sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$REF" --jq .sha)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          run_id=
          if [ "$REBUILD" != "true" ]; then
            # Only push runs: PR runs never get the signing secrets.
            run_id=$(gh run list -R "$GITHUB_REPOSITORY" --workflow ci-android.yml \
              --commit "$sha" --event push --status success --limit 1 \
              --json databaseId --jq '.[0].databaseId // empty')
          fi
          if [ -n "$run_id" ] && gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts" \
              --jq '.artifacts[] | select(.expired | not) | .name' | grep -qx apk-release; then
            echo "Reusing Android CI run $run_id for $sha"
          else
            echo "No reusable Android CI build for $sha, building it"
            run_id=
          fi
          echo "run-id=$run_id" >> "$GITHUB_OUTPUT"

  build:
    needs: find-build
    if: needs.find-build.outputs.run-id == ''
    uses: ./.github/workflows/ci-android.yml
    with:
      ref: ${{ needs.find-build.outputs.sha }}
    secrets: inherit

  release:
    needs: [find-build, build]
    if: ${{ !cancelled() && needs.find-build.result == 'success' && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts
          run-id: ${{ needs.find-build.outputs.run-id || github.run_id }}
          github-token: ${{ github.token }}

      - name: Collect artifacts
        env:
          TAG: ${{ github.event.inputs.tag }}
        run: |
          mkdir dist
          # Debug builds are debuggable and stay CI-only: never publish them.
          cp artifacts/apk-release/*.apk "dist/LibrePods-FOSS-$TAG-release.apk"
          cp artifacts/root-module-zips/*-release.zip "dist/LibrePods-FOSS-$TAG-release.zip"
          ls -l dist

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag }}
          SHA: ${{ needs.find-build.outputs.sha }}
          NOTES: ${{ github.event.inputs.notes }}
          PRERELEASE: ${{ github.event.inputs.prerelease }}
        run: |
          args=(-R "$GITHUB_REPOSITORY" --target "$SHA" --title "LibrePods $TAG")
          if [ -n "$NOTES" ]; then
            printf '%s\n' "$NOTES" > notes.md
            args+=(--notes-file notes.md)
          else
            args+=(--generate-notes)
          fi
          if [ "$PRERELEASE" = "true" ]; then
            args+=(--prerelease)
          fi
          gh release create "$TAG" "${args[@]}" dist/*.apk dist/*.zip

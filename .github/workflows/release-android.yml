name: Android Release

# Manually cut a GitHub release: builds the FOSS APKs from `ref`, creates the
# tag (if it does not exist yet) and publishes a release with the APKs attached.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to create, e.g. v1.0.0-rc3-free
        required: true
      ref:
        description: Branch or commit to release
        required: true
        default: main
      notes:
        description: Release notes (Markdown). Empty = auto-generated from merged PRs.
        required: false
        default: ''
      prerelease:
        description: Mark as pre-release
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_KEYSTORE_FILE: ${{ secrets.RELEASE_KEYSTORE_FILE }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          ref: ${{ github.event.inputs.ref }}
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Accept Licenses
        run: yes | sdkmanager --licenses
      - name: Install NDK
        run: sdkmanager "ndk;30.0.14904198"

      # Optional signing, same as Android CI: without the secrets the release
      # APK is left unsigned.
      - name: Configure release signing
        if: env.RELEASE_KEYSTORE_FILE != ''
        run: |
          echo "$RELEASE_KEYSTORE_FILE" | base64 --decode > android/release.keystore
          cat <<EOF > android/local.properties
          RELEASE_STORE_FILE=../release.keystore
          RELEASE_STORE_PASSWORD=${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS=${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD=${{ secrets.RELEASE_KEY_PASSWORD }}
          EOF

      - name: Build APKs
        run: ./gradlew assembleFossDebug assembleFossRelease
        working-directory: android

      - name: Collect APKs
        env:
          TAG: ${{ github.event.inputs.tag }}
        run: |
          mkdir dist
          cp android/app/build/outputs/apk/foss/debug/*.apk "dist/LibrePods-FOSS-$TAG-debug.apk"
          cp android/app/build/outputs/apk/foss/release/*.apk "dist/LibrePods-FOSS-$TAG-release.apk"
          ls -l dist

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag }}
          NOTES: ${{ github.event.inputs.notes }}
          PRERELEASE: ${{ github.event.inputs.prerelease }}
        run: |
          args=(--target "$(git rev-parse HEAD)" --title "LibrePods $TAG")
          if [ -n "$NOTES" ]; then
            printf '%s\n' "$NOTES" > notes.md
            args+=(--notes-file notes.md)
          else
            args+=(--generate-notes)
          fi
          if [ "$PRERELEASE" = "true" ]; then
            args+=(--prerelease)
          fi
          gh release create "$TAG" "${args[@]}" dist/*.apk
